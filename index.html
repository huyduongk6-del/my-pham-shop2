    <script>
      (function() {
        var isGitHubPages = window.location.hostname.includes('github.io');
        if (isGitHubPages) {
          var repoName = '/my-pham-shop2';
          var originalSet = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src').set;
          Object.defineProperty(HTMLImageElement.prototype, 'src', {
            set: function(val) {
              if (typeof val === 'string' && val.includes('/images/') && !val.includes(repoName)) {
                var url = new URL(val, window.location.href);
                if (url.pathname.startsWith('/images/')) {
                  val = repoName + url.pathname + url.search + url.hash;
                }
              }
              originalSet.call(this, val);
            }
          });
        }
      })();
    </script>

    <div id="root"></div>
